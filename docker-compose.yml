services:
  camera-agent:
    build: .
    container_name: camera-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    devices:
      # Map the camera device
      - "/dev/video0:/dev/video0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      # Persist Ollama models
      - ollama_data:/root/.ollama
      # Persist application data
      - ./detected_images:/app/detected_images
      - ./processed_frames:/app/processed_frames
      # Mount config to allow editing without rebuilding
      - ./config.yaml:/app/config.yaml
      # Persist database
      - ./camera_agent.db:/app/camera_agent.db
      # Mount custom models directory (create ./models/custom locally first)
      - ./models:/models
    environment:
      - CAMERA_INDEX=0
      - OLLAMA_URL=http://localhost:11434
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=8080
      # Custom model settings (set USE_CUSTOM_MODEL=true after downloading model)
      - USE_CUSTOM_MODEL=false
      - CUSTOM_MODEL_DIR=/models/custom
      - VISION_MODEL=qwen3-vl:8b  
      - OLLAMA_CONTEXT_LENGTH=32768

volumes:
  ollama_data:
