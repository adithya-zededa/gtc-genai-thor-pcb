services:
  camera-agent:
    build: .
    container_name: camera-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    devices:
      # Map the camera device
      - "/dev/video0:/dev/video0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      # Persist Ollama models
      - ollama_data:/root/.ollama
      # Persist application data
      - ./detected_images:/app/detected_images
      - ./processed_frames:/app/processed_frames
      # Mount config to allow editing without rebuilding
      - ./config.yaml:/app/config.yaml
      # Persist database
      - ./camera_agent.db:/app/camera_agent.db
    environment:
      - CAMERA_INDEX=0
      - OLLAMA_URL=http://localhost:11434
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=8080

volumes:
  ollama_data:
