services:
  camera-agent:
    build: .
    container_name: camera-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    devices:
      # Map the camera device
      - "/dev/video0:/dev/video0"
    volumes:
      # Persist application data
      - ./detected_images:/app/detected_images
      - ./processed_frames:/app/processed_frames
      # Mount config to allow editing without rebuilding
      - ./config.yaml:/app/config.yaml
      # Persist database
      - ./camera_agent.db:/app/camera_agent.db
    environment:
      - CAMERA_INDEX=0
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=8080
      # vLLM server URL (required - start vLLM separately or use Helm chart)
      - VLLM_URL=http://vllm-server:8000
      - VISION_MODEL=  # auto-detected from vLLM server
      - VLLM_TIMEOUT=300
      - VLLM_TEMPERATURE=0.1
    depends_on:
      - vllm-server

  vllm-server:
    image: nvcr.io/nvidia/tritonserver:25.12-vllm-python-py3
    container_name: vllm-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - vllm_cache:/root/.cache/huggingface
    environment:
      - HF_HOME=/root/.cache/huggingface
    command:
      - vllm
      - serve
      - Qwen/Qwen3-VL-4B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --tensor-parallel-size=1
      - --gpu-memory-utilization=0.85
      - --max-model-len=16000
      - --trust-remote-code
      - --enable-prefix-caching

volumes:
  vllm_cache:
