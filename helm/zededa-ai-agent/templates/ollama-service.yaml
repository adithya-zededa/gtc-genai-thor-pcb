{{- if .Values.ollama.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zededa-ai-agent.fullname" . }}-ollama
  labels:
    {{- include "zededa-ai-agent.ollama.labels" . | nindent 4 }}
  {{- with .Values.ollama.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.ollama.service.type }}
  ports:
  - port: {{ .Values.ollama.service.port }}
    targetPort: http
    protocol: TCP
    name: http
    {{- if and (eq .Values.ollama.service.type "NodePort") .Values.ollama.service.nodePort }}
    nodePort: {{ .Values.ollama.service.nodePort }}
    {{- end }}
  selector:
    {{- include "zededa-ai-agent.ollama.selectorLabels" . | nindent 4 }}
{{- end }}
