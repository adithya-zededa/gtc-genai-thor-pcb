{{- if .Values.agent.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zededa-ai-agent.fullname" . }}-agent
  labels:
    {{- include "zededa-ai-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  replicas: {{ .Values.agent.replicaCount }}
  selector:
    matchLabels:
      {{- include "zededa-ai-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/agent-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "zededa-ai-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "zededa-ai-agent.serviceAccountName" . }}
      containers:
      - name: agent
        image: "{{ .Values.global.imageRegistry }}{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
        imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
        {{- if .Values.agent.securityContext }}
        securityContext:
          {{- toYaml .Values.agent.securityContext | nindent 10 }}
        {{- end }}
        env:
        - name: OLLAMA_URL
          value: "http://{{ include "zededa-ai-agent.fullname" . }}-ollama:{{ .Values.ollama.service.port }}"
        - name: VISION_MODEL
          value: {{ (.Values.agent.visionModel | default "llava") | quote }}
        - name: CAMERA_INDEX
          value: {{ .Values.agent.cameraIndex | quote }}
        - name: CAPTURE_INTERVAL
          value: {{ .Values.agent.captureInterval | quote }}
        - name: CONFIG_FILE
          value: "/config/alert_rules.json"
        resources:
          {{- toYaml .Values.agent.resources | nindent 10 }}
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: video-devices
          mountPath: /dev
        {{- if .Values.agent.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.agent.livenessProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.agent.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.agent.readinessProbe | nindent 10 }}
        {{- end }}
      volumes:
      - name: config
        configMap:
          name: {{ include "zededa-ai-agent.fullname" . }}-agent-config
      {{- with .Values.agent.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
