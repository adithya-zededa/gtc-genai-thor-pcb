{{- if and .Values.agent.enabled .Values.agent.service.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zededa-ai-agent.fullname" . }}-agent
  labels:
    {{- include "zededa-ai-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
  {{- with .Values.agent.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.agent.service.type }}
  ports:
    - port: {{ .Values.agent.service.port }}
      targetPort: 8081
      protocol: TCP
      name: http
  selector:
    {{- include "zededa-ai-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agent
{{- end }}
