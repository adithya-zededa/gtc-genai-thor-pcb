# Default values for camera-agent

replicaCount: 1

image:
  repository: adithyazededa/camera-agent
  pullPolicy: Always
  tag: "1.5.6-gpu"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext:
  privileged: true  # Required for camera and GPU access

service:
  type: NodePort
  port: 8080
  nodePort: 30080
  # Ollama port (internal)
  ollamaPort: 11434

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: camera-agent.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    nvidia.com/gpu: 1
  requests:
    memory: "25Gi"
    cpu: "2"

# Camera device configuration
camera:
  # Enable camera device mount (set to false if no camera available)
  enabled: false
  # Device path on the host
  devicePath: /dev/video0
  # Camera index used by OpenCV
  index: 0

# Ollama configuration
ollama:
  # Model to use (no default - must be set)
  visionModel: ""
  decisionModel: ""
  # Context length for Ollama models
  contextLength: "32768"

# Environment variables
env:
  FLASK_RUN_HOST: "0.0.0.0"
  FLASK_RUN_PORT: "8080"
  OLLAMA_URL: "http://localhost:11434"
  LOG_LEVEL: "INFO"

nodeSelector: {}

tolerations:
  # Tolerate GPU nodes
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

affinity: {}

# GPU scheduling - requires NVIDIA device plugin
gpu:
  enabled: true
  # Number of GPUs to request
  count: 1
  # RuntimeClassName for NVIDIA GPU access (set to empty to disable)
  # Note: On K3s with Docker backend, the nvidia-container-runtime is configured
  # at the Docker level, not via RuntimeClass. Leave empty unless your cluster
  # specifically requires a RuntimeClass for GPU access.
  runtimeClassName: ""

# Inference backend selection: "vllm" (recommended), "ollama" (standalone server), or "default" (embedded ollama)
inferenceBackend: "vllm"

# vLLM Server configuration (when inferenceBackend: "vllm")
vllmServer:
  # URL to connect to vLLM server
  url: "http://localhost:8000"
  # Model to serve - full Hugging Face model name
  model: "Qwen/Qwen3-VL-8B-Instruct"
  # Inference timeout in seconds
  timeout: 300
  # Temperature for generation
  temperature: 0.1
  
  # If running vLLM as a sidecar or separate deployment
  image:
    repository: vllm/vllm-openai
    tag: "latest"
    pullPolicy: IfNotPresent
  
  # vLLM server arguments
  args:
    # GPU memory utilization (0.0 - 1.0)
    gpuMemoryUtilization: 0.9
    # Maximum model length
    maxModelLen: 32768
    # Trust remote code (required for some models)
    trustRemoteCode: true
    # Enable prefix caching
    enablePrefixCaching: true
  
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  
  resources:
    requests:
      memory: "16Gi"
      cpu: "4"
    limits:
      memory: "32Gi"
      cpu: "8"
      nvidia.com/gpu: 1

# Model configuration for custom model loading
model:
  name: "custom-model"
  version: "1.0.0"
  # Hugging Face model download (preferred method)
  huggingface:
    enabled: false
    repoId: "unsloth/Qwen3-VL-8B-Instruct-GGUF"
    token: ""
    # Optional: specific file to download
    filename: ""
    # Optional: quantization preference (Q4_K_M, Q5_K_M, Q8_0, etc.)
    quantization: "Q4_K_M"
  # Alternative: Custom backend service
  backendService:
    # Base URL for model download service
    baseUrl: ""
    # Bearer token for authentication
    bearerToken: ""
    # Catalog ID for the model
    catalogId: ""

# Ollama Server configuration (when inferenceBackend: "ollama")
ollamaServer:
  image:
    repository: ollama/ollama
    tag: "latest"
    pullPolicy: IfNotPresent
  
  # Model downloader init container
  modelDownloader:
    image:
      repository: adithyazededa/hf-model-downloader
      tag: "1.0.0"
      pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 11434
    targetPort: 11434
    nodePort: null
  
  config:
    keepAlive: "5m"
    numParallel: 1
    debug: false
  
  # Custom model configuration
  modelConfig:
    temperature: 0.7
    topK: 40
    topP: 0.9
    numCtx: 32000
    repeatPenalty: 1.1
    systemMessage: "You are a helpful AI assistant."
    template: null
  
  # Additional models to pull after loading custom model
  pullAdditionalModels: false
  additionalModels: []
    # - llama2:7b
    # - mistral:7b
  
  livenessProbe:
    httpGet:
      path: /api/tags
      port: http
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5
  
  readinessProbe:
    httpGet:
      path: /api/tags
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  resources:
    requests:
      memory: "8Gi"
      cpu: "2"
    limits:
      memory: "16Gi"
      cpu: "4"
      nvidia.com/gpu: 1
  
  env: []
    # - name: CUSTOM_ENV
    #   value: "custom-value"

# Persistence configuration
persistence:
  # Ollama models storage
  ollama:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 50Gi
  # Application data (detected images, database)
  data:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
  # Shared storage for model files (used by Ollama server backend)
  sharedStorage:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 20Gi
