# Default values for camera-agent

replicaCount: 1

image:
  repository: adithyazededa/gtc-genai-thor-pcb
  pullPolicy: Always
  tag: "v57"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# RBAC for Kubernetes API access (pod/service listing)
rbac:
  create: true

podAnnotations: {}

podSecurityContext:
  # Add video group (44) for camera access and audio group (29) for speaker access
  supplementalGroups: [44, 29]
  # Matches the non-root appuser (UID/GID 1000) baked into the image, so
  # the PVC-backed /app/data volume is group-writable by that user.
  fsGroup: 1000

securityContext:
  privileged: true  # Required for camera and GPU access

service:
  type: NodePort
  port: 8080
  nodePort: 30080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: camera-agent.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Resources for camera-agent (NOTE: when vllmServer.enabled=true, GPU is on vLLM pod)
resources:
  limits:
    memory: "4Gi"
    cpu: "2"
    # nvidia.com/gpu: 1  # Only needed if running local inference
  requests:
    memory: "2Gi"
    cpu: "500m"

# Camera device configuration
camera:
  # Enable camera device mount (set to false if no camera available)
  enabled: true
  # Device path on the host
  devicePath: /dev/video0
  # Camera index used by OpenCV
  index: 0

# Speaker device configuration
speaker:
  # Enable speaker device mount (set to false if no speaker available)
  enabled: false
  # Device path on the host (typically /dev/snd for ALSA sound devices)
  devicePath: /dev/snd
  # Audio device to use (ALSA device specification, optional - leave empty for system default)
  # Examples:
  #   "hw:2,0" - USB speaker (use 'aplay -l' to find your device number)
  #   "plughw:2,0" - USB speaker with automatic format conversion
  #   "hw:0,0" - Built-in audio
  # To find your USB speaker: run 'aplay -l' or 'cat /proc/asound/cards'
  device: "hw:2,0"
  # Speaker volume level (0-100, where 100 is maximum volume)
  # Set to an appropriate level to ensure audio is audible
  volume: 85

# Environment variables
env:
  FLASK_RUN_HOST: "0.0.0.0"
  FLASK_RUN_PORT: "8080"
  LOG_LEVEL: "INFO"

nodeSelector: {}

tolerations:
  # Tolerate GPU nodes
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

affinity: {}

# GPU scheduling for camera-agent (not needed when vllmServer.enabled=true)
gpu:
  enabled: false  # GPU is on vLLM pod, not camera-agent
  # Number of GPUs to request
  count: 1
  # RuntimeClassName for NVIDIA GPU access (set to empty to disable)
  # Note: On K3s with Docker backend, the nvidia-container-runtime is configured
  # at the Docker level, not via RuntimeClass. Leave empty unless your cluster
  # specifically requires a RuntimeClass for GPU access.
  runtimeClassName: ""

# ── Two-model topology ──────────────────────────────────────────────────
# The agent runs two models on two vLLM pods sharing one physical GPU via
# device-plugin time slicing:
#
#   vllmServer (vision) — looks at frames, emits a structured defect verdict
#   vllmAgent  (agent)  — classifies intent, answers chat, drives tools;
#                         never sees pixels, only the vision model's output
#
# Time slicing shares GPU memory rather than partitioning it, so the two
# gpuMemoryUtilization values below must sum to well under 1.0. Defaults are
# 0.30 + 0.25 = 0.55, leaving headroom for the app pod and the OS on a
# 128 GB unified-memory Thor.
#
# Prerequisite: the node must advertise at least 2 nvidia.com/gpu replicas.
# Check with:
#   kubectl get node -o jsonpath='{.items[0].status.capacity.nvidia\.com/gpu}'
# If it reports 1, enable gpuTimeSlicing below (or configure the device
# plugin out-of-band) or the second pod stays Pending.

# vLLM Server configuration — VISION model
vllmServer:
  # Enable vLLM server deployment
  enabled: true
  # URL to connect to vLLM server (auto-set when enabled, or override for external vLLM)
  url: ""
  # Model to serve — a Hugging Face repo id, or the in-container mount path
  # when localModel.enabled is true (the two must match).
  model: "LiquidAI/LFM2.5-VL-1.6B-PCB-Inspect"

  # Load weights from a directory already on the node instead of pulling from
  # the Hugging Face Hub at startup. The reference Thor deployment uses this
  # for the fine-tuned inspection model, which is downloaded out-of-band:
  #   localModel:
  #     enabled: true
  #     hostPath: /home/nvidia/models/LFM2.5-VL-1.6B-PCB-Inspect
  #     mountPath: /models/LFM2.5-VL-1.6B-PCB-Inspect
  #   model: /models/LFM2.5-VL-1.6B-PCB-Inspect
  localModel:
    enabled: false
    # Absolute path on the node holding config.json, *.safetensors, tokenizer
    hostPath: ""
    # Where to mount it inside the container — must equal `model` above
    mountPath: ""

  # Inference timeout in seconds
  timeout: 300
  # Temperature for generation
  temperature: 0.1
  # Hugging Face token for gated models (optional)
  # DO NOT commit real tokens here — pass via --set at install time,
  # or use secrets.existingSecret to reference a pre-created K8s Secret.
  huggingfaceToken: ""
  # NGC API key for pulling images from nvcr.io and accessing NGC resources
  # DO NOT commit real keys here — pass via --set at install time,
  # or use secrets.existingSecret to reference a pre-created K8s Secret.
  ngcApiKey: ""
  # RuntimeClassName for GPU access (optional)
  runtimeClassName: "nvidia"
  # Pod security context. Defaults to privileged since Helm can't know
  # whether the target cluster's GPU device plugin needs full privilege
  # for passthrough — scope this down on clusters where it doesn't.
  securityContext:
    privileged: true
  # Single-GPU nodes cannot safely roll this deployment. Recreate avoids
  # upgrade deadlocks where the old pod keeps the only GPU allocated.
  deploymentStrategy: Recreate
  
  # vLLM container image - using NVIDIA Triton Server with vLLM
  image:
    repository: nvcr.io/nvidia/tritonserver
    tag: "25.12-vllm-python-py3"
    pullPolicy: IfNotPresent
  
  # vLLM server arguments
  args:
    # Tensor parallel size
    tensorParallelSize: 1
    # GPU memory utilization (0.0 - 1.0). Shared device: keep this plus
    # vllmAgent.args.gpuMemoryUtilization comfortably below 1.0.
    gpuMemoryUtilization: 0.30
    # Maximum model length (needs to be large enough for image tokens + tools prompt)
    maxModelLen: 16000
    # Data type (auto, float16, bfloat16, float32)
    dtype: "auto"
    # Trust remote code (required for some models)
    trustRemoteCode: true
    # Enable prefix caching
    enablePrefixCaching: true
  
  # Extra args to pass to vLLM
  extraArgs: []
  
  # Extra environment variables
  env: []
  
  service:
    type: ClusterIP
    port: 8000
  
  # Persistence for model cache
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 50Gi
  
  # Liveness probe - increased delay for model download/loading (can take 10+ minutes)
  livenessProbe:
    initialDelaySeconds: 600
    periodSeconds: 60
    timeoutSeconds: 30
    failureThreshold: 10
  
  # Readiness probe - model loading can take several minutes  
  readinessProbe:
    initialDelaySeconds: 300
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 30
  
  resources:
    requests:
      memory: "16Gi"
      cpu: "4"
    limits:
      memory: "32Gi"
      cpu: "8"
      nvidia.com/gpu: 1

# vLLM Server configuration — AGENT (text) model
# Second pod on the same GPU. See the topology notes above vllmServer for the
# shared-memory budget constraint.
vllmAgent:
  # Enable the agent vLLM server deployment
  enabled: true
  # URL to connect to (auto-set when enabled, or override for external vLLM)
  url: ""
  # Text model driving intent classification, chat, and tool calls.
  model: "LiquidAI/LFM2.5-2.6B"
  timeout: 300
  # Above the vision model's 0.1: this one writes prose and selects tools
  # rather than filling a fixed schema.
  temperature: 0.2
  huggingfaceToken: ""
  runtimeClassName: "nvidia"
  securityContext:
    privileged: true
  # Same rationale as vllmServer: a rolling update deadlocks waiting for a GPU
  # slice the outgoing pod still holds.
  deploymentStrategy: Recreate

  # As with the vision model, weights can come from a node directory instead
  # of the Hub. Note that only the vision model is pre-staged under
  # /home/nvidia/models on the reference node — the agent model is pulled
  # from Hugging Face unless it is downloaded there first.
  localModel:
    enabled: false
    hostPath: ""
    mountPath: ""

  image:
    repository: nvcr.io/nvidia/tritonserver
    tag: "25.12-vllm-python-py3"
    pullPolicy: IfNotPresent

  args:
    tensorParallelSize: 1
    # A 2.6B text model needs far less headroom than the VLM; its KV cache is
    # also cheaper (no image tokens).
    gpuMemoryUtilization: 0.25
    maxModelLen: 16000
    dtype: "auto"
    trustRemoteCode: true
    enablePrefixCaching: true

  extraArgs: []
  env: []

  service:
    type: ClusterIP
    port: 8000

  # Separate from the vision cache: a ReadWriteOnce PVC cannot be mounted
  # writable by both pods.
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 30Gi

  livenessProbe:
    initialDelaySeconds: 600
    periodSeconds: 60
    timeoutSeconds: 30
    failureThreshold: 10

  readinessProbe:
    initialDelaySeconds: 300
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 30

  resources:
    requests:
      memory: "8Gi"
      cpu: "2"
    limits:
      memory: "16Gi"
      cpu: "4"
      nvidia.com/gpu: 1

# ── GPU time slicing ────────────────────────────────────────────────────
# Makes the NVIDIA device plugin advertise `replicas` schedulable copies of
# each physical GPU, so both vLLM pods can be admitted on a single-GPU node.
#
# Disabled by default: this ConfigMap belongs to the device plugin, not to
# this application, and is frequently managed elsewhere (on the reference
# Thor cluster it is applied as a k3s addon). Enabling it where something
# else already owns the object will cause the two to fight.
#
# When enabled, restart the plugin to pick up the change:
#   kubectl -n kube-system rollout restart ds/nvidia-device-plugin-daemonset
gpuTimeSlicing:
  enabled: false
  replicas: 2
  namespace: kube-system
  daemonsetName: nvidia-device-plugin-daemonset
  configMapName: nvidia-device-plugin-config
  configKey: config.yaml

# Model configuration for custom model loading
model:
  name: "custom-model"
  version: "1.0.0"
  # Hugging Face model download (preferred method)
  huggingface:
    enabled: false
    repoId: "unsloth/Qwen3-VL-8B-Instruct-GGUF"
    token: ""
    # Optional: specific file to download
    filename: ""
    # Optional: quantization preference (Q4_K_M, Q5_K_M, Q8_0, etc.)
    quantization: "Q4_K_M"
  # Alternative: Custom backend service
  backendService:
    # Base URL for model download service
    baseUrl: ""
    # Bearer token for authentication
    bearerToken: ""
    # Catalog ID for the model
    catalogId: ""

# ── Secrets management ──────────────────────────────────────────────
# Option A (recommended): create the secret out-of-band and reference it:
#   kubectl create secret generic my-tokens --from-literal=hf-token=hf_xxx
#   Then set secrets.existingSecret: "my-tokens"
#
# Option B: pass tokens at install time (chart creates the Secret):
#   helm install ... --set vllmServer.huggingfaceToken=hf_xxx
#
# Option C (GitOps): use Sealed Secrets / External Secrets Operator to
#   create the K8s secret, then reference it via secrets.existingSecret.
secrets:
  # Name of a pre-existing Kubernetes Secret that contains the tokens.
  # When set, the chart will NOT create its own Secret.
  existingSecret: ""
  # Key inside the secret that holds the HuggingFace token
  huggingfaceTokenKey: "hf-token"
  # Key inside the secret that holds the NGC API key
  ngcApiKeyKey: "ngc-api-key"

# Persistence configuration
persistence:
  # Application data (detected images, database)
  data:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
  # Shared storage for model files (used by vLLM)
  sharedStorage:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 20Gi
