# Default values for camera-agent

replicaCount: 1

image:
  repository: adithyazededa/gtc-genai-thor-pcb
  pullPolicy: Always
  tag: "v51"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# RBAC for Kubernetes API access (pod/service listing)
rbac:
  create: true

podAnnotations: {}

podSecurityContext:
  # Add video group (44) for camera access and audio group (29) for speaker access
  supplementalGroups: [44, 29]

securityContext:
  privileged: true  # Required for camera and GPU access

service:
  type: NodePort
  port: 8080
  nodePort: 30080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: camera-agent.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Resources for camera-agent (NOTE: when vllmServer.enabled=true, GPU is on vLLM pod)
resources:
  limits: {}
    # nvidia.com/gpu: 1  # Only needed if running local inference
  requests:
    memory: "2Gi"
    cpu: "500m"

# Camera device configuration
camera:
  # Enable camera device mount (set to false if no camera available)
  enabled: true
  # Device path on the host
  devicePath: /dev/video0
  # Camera index used by OpenCV
  index: 0

# Speaker device configuration
speaker:
  # Enable speaker device mount (set to false if no speaker available)
  enabled: false
  # Device path on the host (typically /dev/snd for ALSA sound devices)
  devicePath: /dev/snd
  # Audio device to use (ALSA device specification, optional - leave empty for system default)
  # Examples:
  #   "hw:2,0" - USB speaker (use 'aplay -l' to find your device number)
  #   "plughw:2,0" - USB speaker with automatic format conversion
  #   "hw:0,0" - Built-in audio
  # To find your USB speaker: run 'aplay -l' or 'cat /proc/asound/cards'
  device: "hw:2,0"
  # Speaker volume level (0-100, where 100 is maximum volume)
  # Set to an appropriate level to ensure audio is audible
  volume: 85

# Environment variables
env:
  FLASK_RUN_HOST: "0.0.0.0"
  FLASK_RUN_PORT: "8080"
  LOG_LEVEL: "INFO"

nodeSelector: {}

tolerations:
  # Tolerate GPU nodes
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

affinity: {}

# GPU scheduling for camera-agent (not needed when vllmServer.enabled=true)
gpu:
  enabled: false  # GPU is on vLLM pod, not camera-agent
  # Number of GPUs to request
  count: 1
  # RuntimeClassName for NVIDIA GPU access (set to empty to disable)
  # Note: On K3s with Docker backend, the nvidia-container-runtime is configured
  # at the Docker level, not via RuntimeClass. Leave empty unless your cluster
  # specifically requires a RuntimeClass for GPU access.
  runtimeClassName: ""

# vLLM Server configuration
vllmServer:
  # Enable vLLM server deployment
  enabled: true
  # URL to connect to vLLM server (auto-set when enabled, or override for external vLLM)
  url: ""
  # Model to serve - full Hugging Face model name
  model: "nvidia/Cosmos-Reason2-8B"
  # Inference timeout in seconds
  timeout: 300
  # Temperature for generation
  temperature: 0.1
  # Hugging Face token for gated models (optional)
  # DO NOT commit real tokens here — pass via --set at install time,
  # or use secrets.existingSecret to reference a pre-created K8s Secret.
  huggingfaceToken: ""
  # RuntimeClassName for GPU access (optional)
  runtimeClassName: "nvidia"
  
  # vLLM container image - using NVIDIA Triton Server with vLLM
  image:
    repository: nvcr.io/nvidia/tritonserver
    tag: "25.12-vllm-python-py3"
    pullPolicy: IfNotPresent
  
  # vLLM server arguments
  args:
    # Tensor parallel size
    tensorParallelSize: 1
    # GPU memory utilization (0.0 - 1.0)
    gpuMemoryUtilization: 0.5
    # Maximum model length (needs to be large enough for image tokens + tools prompt)
    maxModelLen: 16000
    # Data type (auto, float16, bfloat16, float32)
    dtype: "auto"
    # Trust remote code (required for some models)
    trustRemoteCode: true
    # Enable prefix caching
    enablePrefixCaching: true
  
  # Extra args to pass to vLLM
  extraArgs: []
  
  # Extra environment variables
  env: []
  
  service:
    type: ClusterIP
    port: 8000
  
  # Persistence for model cache
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 50Gi
  
  # Liveness probe - increased delay for model download/loading (can take 10+ minutes)
  livenessProbe:
    initialDelaySeconds: 600
    periodSeconds: 60
    timeoutSeconds: 30
    failureThreshold: 10
  
  # Readiness probe - model loading can take several minutes  
  readinessProbe:
    initialDelaySeconds: 300
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 30
  
  resources:
    requests:
      memory: "16Gi"
      cpu: "4"
    limits:
      memory: "32Gi"
      cpu: "8"
      nvidia.com/gpu: 1

# Model configuration for custom model loading
model:
  name: "custom-model"
  version: "1.0.0"
  # Hugging Face model download (preferred method)
  huggingface:
    enabled: false
    repoId: "unsloth/Qwen3-VL-8B-Instruct-GGUF"
    token: ""
    # Optional: specific file to download
    filename: ""
    # Optional: quantization preference (Q4_K_M, Q5_K_M, Q8_0, etc.)
    quantization: "Q4_K_M"
  # Alternative: Custom backend service
  backendService:
    # Base URL for model download service
    baseUrl: ""
    # Bearer token for authentication
    bearerToken: ""
    # Catalog ID for the model
    catalogId: ""

# ── Secrets management ──────────────────────────────────────────────
# Option A (recommended): create the secret out-of-band and reference it:
#   kubectl create secret generic my-tokens --from-literal=hf-token=hf_xxx
#   Then set secrets.existingSecret: "my-tokens"
#
# Option B: pass tokens at install time (chart creates the Secret):
#   helm install ... --set vllmServer.huggingfaceToken=hf_xxx
#
# Option C (GitOps): use Sealed Secrets / External Secrets Operator to
#   create the K8s secret, then reference it via secrets.existingSecret.
secrets:
  # Name of a pre-existing Kubernetes Secret that contains the tokens.
  # When set, the chart will NOT create its own Secret.
  existingSecret: ""
  # Key inside the secret that holds the HuggingFace token
  huggingfaceTokenKey: "hf-token"

# Persistence configuration
persistence:
  # Application data (detected images, database)
  data:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
  # Shared storage for model files (used by vLLM)
  sharedStorage:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 20Gi
