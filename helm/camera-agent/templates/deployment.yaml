apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "camera-agent.fullname" . }}
  labels:
    {{- include "camera-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "camera-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "camera-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "camera-agent.serviceAccountName" . }}
      {{- if .Values.gpu.runtimeClassName }}
      runtimeClassName: {{ .Values.gpu.runtimeClassName }}
      {{- end }}
      hostNetwork: {{ .Values.hostNetwork | default false }}
      dnsPolicy: {{ if .Values.hostNetwork }}ClusterFirstWithHostNet{{ else }}ClusterFirst{{ end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CAMERA_INDEX
              value: "{{ .Values.camera.index }}"
            - name: CAMERA_AGENT_DATA_DIR
              value: "/app/data"
            - name: CAMERA_AGENT_DB
              value: "/app/data/camera_agent.db"
            - name: DETECTED_IMAGES_DIR
              value: "/app/data/detected_images"
            - name: PROCESSED_FRAMES_DIR
              value: "/app/data/processed_frames"
            {{- if .Values.speaker.enabled }}
            - name: SPEAKER_DEVICE
              value: {{ .Values.speaker.device | default "" | quote }}
            - name: SPEAKER_VOLUME
              value: {{ .Values.speaker.volume | default 85 | quote }}
            {{- end }}
            - name: VLLM_URL
              {{- if and .Values.vllmServer.enabled (not .Values.vllmServer.url) }}
              value: "http://{{ include "camera-agent.fullname" . }}-vllm:{{ .Values.vllmServer.service.port }}"
              {{- else }}
              value: {{ .Values.vllmServer.url | default "http://localhost:8000" | quote }}
              {{- end }}
            - name: VISION_MODEL
              value: {{ .Values.vllmServer.model | quote }}
            - name: VLLM_TIMEOUT
              value: {{ .Values.vllmServer.timeout | default 300 | quote }}
            - name: VLLM_TEMPERATURE
              value: {{ .Values.vllmServer.temperature | default 0.1 | quote }}
            {{- if or .Values.vllmAgent.enabled .Values.vllmAgent.url }}
            {{/*
              Agent (text) model endpoint. When these are unset the app falls
              back to VLLM_URL/VISION_MODEL, so a single-pod deployment keeps
              working with both roles served by the vision pod.
            */}}
            - name: AGENT_LLM_URL
              {{- if and .Values.vllmAgent.enabled (not .Values.vllmAgent.url) }}
              value: "http://{{ include "camera-agent.fullname" . }}-vllm-agent:{{ .Values.vllmAgent.service.port }}"
              {{- else }}
              value: {{ .Values.vllmAgent.url | quote }}
              {{- end }}
            - name: AGENT_MODEL
              value: {{ .Values.vllmAgent.model | quote }}
            - name: AGENT_LLM_TIMEOUT
              value: {{ .Values.vllmAgent.timeout | default 300 | quote }}
            - name: AGENT_LLM_TEMPERATURE
              value: {{ .Values.vllmAgent.temperature | default 0.2 | quote }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          # Startup gate. start.sh waits for the vLLM pods before exec'ing
          # the app, which can take many minutes on a cold model load, so
          # the slow boot is absorbed here rather than by a long
          # initialDelaySeconds on the liveness probe.
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          # Liveness is deliberately dependency-free: /api/health/live
          # touches neither the database nor the inference pods, so a vLLM
          # outage can never restart a perfectly healthy app container.
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          # Readiness gates Service traffic on local dependencies only
          # (the SQLite database). /api/ready returns 503 when they fail;
          # the old /api/status target always returned 200, so readiness
          # was never able to pull a broken pod out of rotation.
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.camera.enabled }}
            - name: camera-device
              mountPath: {{ .Values.camera.devicePath }}
            {{- end }}
            {{- if .Values.speaker.enabled }}
            - name: speaker-device
              mountPath: {{ .Values.speaker.devicePath }}
            {{- end }}
            {{- if .Values.persistence.data.enabled }}
            - name: app-data
              mountPath: /app/data
            {{- end }}
            {{- if .Values.gpu.enabled }}
            # NVIDIA Jetson library mounts for GPU access
            - name: nvidia-libs
              mountPath: /usr/lib/aarch64-linux-gnu/nvidia
              readOnly: true
            - name: nvidia-tegra
              mountPath: /usr/lib/aarch64-linux-gnu/tegra
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.camera.enabled }}
        - name: camera-device
          hostPath:
            path: {{ .Values.camera.devicePath }}
            type: CharDevice
        {{- end }}
        {{- if .Values.speaker.enabled }}
        - name: speaker-device
          hostPath:
            path: {{ .Values.speaker.devicePath }}
            type: Directory
        {{- end }}
        {{- if .Values.persistence.data.enabled }}
        - name: app-data
          persistentVolumeClaim:
            claimName: {{ include "camera-agent.fullname" . }}-data
        {{- end }}
        {{- if .Values.gpu.enabled }}
        # NVIDIA Jetson host library volumes
        - name: nvidia-libs
          hostPath:
            path: /usr/lib/aarch64-linux-gnu/nvidia
            type: Directory
        - name: nvidia-tegra
          hostPath:
            path: /usr/lib/aarch64-linux-gnu/tegra
            type: DirectoryOrCreate
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
