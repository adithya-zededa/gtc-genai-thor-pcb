{{- if .Values.vllmAgent.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "camera-agent.fullname" . }}-vllm-agent
  labels:
    {{- include "camera-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: vllm-agent
spec:
  type: {{ .Values.vllmAgent.service.type }}
  ports:
    - port: {{ .Values.vllmAgent.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "camera-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: vllm-agent
{{- end }}
