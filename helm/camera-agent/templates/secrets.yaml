{{/*
  Create a Secret for HuggingFace / NGC tokens only when the chart manages
  the secret (i.e. no pre-existing secret was supplied) AND at least one
  token value is provided via --set or values override.
*/}}
{{- if not .Values.secrets.existingSecret }}
{{- if or .Values.vllmServer.huggingfaceToken .Values.model.huggingface.token .Values.vllmServer.ngcApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "camera-agent.fullname" . }}-tokens
  labels:
    {{- include "camera-agent.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.vllmServer.huggingfaceToken }}
  hf-token: {{ .Values.vllmServer.huggingfaceToken | b64enc | quote }}
  {{- end }}
  {{- if .Values.model.huggingface.token }}
  model-hf-token: {{ .Values.model.huggingface.token | b64enc | quote }}
  {{- end }}
  {{- if .Values.vllmServer.ngcApiKey }}
  ngc-api-key: {{ .Values.vllmServer.ngcApiKey | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- if and .Values.vllmServer.ngcApiKey (not .Values.secrets.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "camera-agent.fullname" . }}-nvcr
  labels:
    {{- include "camera-agent.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict "nvcr.io" (dict "username" "$oauthtoken" "password" .Values.vllmServer.ngcApiKey)) | toJson | b64enc | quote }}
{{- end }}
