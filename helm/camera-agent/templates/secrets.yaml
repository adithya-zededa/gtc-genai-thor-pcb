{{/*
  Create a Secret for HuggingFace / NGC tokens only when the chart manages
  the secret (i.e. no pre-existing secret was supplied) AND at least one
  token value is provided via --set or values override.
*/}}
{{- if not .Values.secrets.existingSecret }}
{{- if or .Values.vllmServer.huggingfaceToken .Values.model.huggingface.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "camera-agent.fullname" . }}-tokens
  labels:
    {{- include "camera-agent.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.vllmServer.huggingfaceToken }}
  hf-token: {{ .Values.vllmServer.huggingfaceToken | b64enc | quote }}
  {{- end }}
  {{- if .Values.model.huggingface.token }}
  model-hf-token: {{ .Values.model.huggingface.token | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
