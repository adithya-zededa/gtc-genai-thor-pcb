{{- if .Values.vllmServer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "camera-agent.fullname" . }}-vllm
  labels:
    {{- include "camera-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: vllm
spec:
  type: {{ .Values.vllmServer.service.type }}
  ports:
    - port: {{ .Values.vllmServer.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "camera-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: vllm
{{- end }}
