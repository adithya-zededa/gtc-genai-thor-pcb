# Example values for Ollama inference backend deployment
# This file demonstrates how to configure the camera-agent with a standalone Ollama server
# that loads custom models from a backend service

# Use Ollama as the inference backend (instead of embedded ollama)
inferenceBackend: "ollama"

# Custom model configuration
model:
  name: "llama3-custom"
  version: "2.0.0"
  backendService:
    # Your model backend service URL
    baseUrl: "https://model-service.example.com/api/v1"
    # Authentication token (consider using secrets in production)
    bearerToken: "your-bearer-token-here"
    # Catalog/organization ID
    catalogId: "your-catalog-id"

# Ollama Server configuration
ollamaServer:
  image:
    repository: ollama/ollama
    tag: "latest"
    pullPolicy: IfNotPresent
  
  # Model downloader - replace with your custom downloader image
  modelDownloader:
    image:
      repository: "your-registry.com/model-downloader"
      tag: "v1.0.0"
      pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP  # Change to NodePort or LoadBalancer if needed
    port: 11434
    targetPort: 11434
    nodePort: null  # Set to 31434 if using NodePort
  
  config:
    keepAlive: "10m"
    numParallel: 2
    debug: false
  
  # Custom model parameters
  modelConfig:
    # Temperature for sampling (0.0 = deterministic, 1.0 = creative)
    temperature: 0.8
    # Top-K sampling parameter
    topK: 40
    # Top-P (nucleus) sampling parameter
    topP: 0.9
    # Context window size
    numCtx: 32000
    # Repetition penalty
    repeatPenalty: 1.1
    # System message for the model
    systemMessage: |
      You are a helpful AI assistant specialized in analyzing camera footage
      and providing detailed descriptions of detected objects and events.
    # Custom template (optional)
    template: |
      {{ .System }}
      
      User: {{ .Prompt }}
      
      Assistant:
  
  # Pull additional standard Ollama models after loading custom model
  pullAdditionalModels: true
  additionalModels:
    - llama2:7b
    - mistral:7b-instruct
  
  livenessProbe:
    httpGet:
      path: /api/tags
      port: http
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5
  
  readinessProbe:
    httpGet:
      path: /api/tags
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  # Resource allocation for Ollama server
  resources:
    requests:
      memory: "12Gi"
      cpu: "4"
    limits:
      memory: "24Gi"
      cpu: "8"
      nvidia.com/gpu: 1
  
  # Additional environment variables
  env:
    - name: OLLAMA_MAX_LOADED_MODELS
      value: "3"
    - name: OLLAMA_MAX_QUEUE
      value: "512"

# GPU configuration
gpu:
  enabled: true
  count: 1
  # Set runtimeClassName if your cluster requires it for GPU access
  runtimeClassName: ""  # e.g., "nvidia" for some clusters

# Storage configuration
persistence:
  # Ollama models storage (persistent)
  ollama:
    enabled: true
    storageClass: ""  # Use default storage class
    accessMode: ReadWriteOnce
    size: 100Gi  # Increase for large models
  
  # Application data
  data:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 20Gi
  
  # Shared storage for model files during initialization
  sharedStorage:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 50Gi  # Should accommodate uncompressed model files

# Camera configuration (for camera-agent use case)
camera:
  enabled: false  # Disable if running standalone Ollama server
  devicePath: /dev/video0
  index: 0

# Main application configuration (not needed for standalone Ollama)
ollama:
  visionModel: qwen3-vl:8b
  decisionModel: llama3-custom  # Use the custom model name
  contextLength: "32000"

# Environment variables for main app
env:
  FLASK_RUN_HOST: "0.0.0.0"
  FLASK_RUN_PORT: "8080"
  # Point to standalone Ollama server
  OLLAMA_URL: "http://{{ include \"camera-agent.fullname\" . }}-ollama-server:11434"
  LOG_LEVEL: "INFO"

# Security context
securityContext:
  privileged: true

podSecurityContext: {}

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Image pull secrets
imagePullSecrets: []

# Replica count
replicaCount: 1

# Pod annotations
podAnnotations: {}

# Node selector
nodeSelector:
  # Example: Select nodes with GPU
  # nvidia.com/gpu: "true"

# Tolerations for GPU nodes
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

# Pod affinity/anti-affinity
affinity: {}
  # Example: Prefer nodes with local NVMe storage
  # nodeAffinity:
  #   preferredDuringSchedulingIgnoredDuringExecution:
  #   - weight: 100
  #     preference:
  #       matchExpressions:
  #       - key: storage-type
  #         operator: In
  #         values:
  #         - nvme

# Service configuration for main app (if running camera-agent)
service:
  type: NodePort
  port: 8080
  nodePort: 30080
  ollamaPort: 11434

# Ingress configuration (optional)
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: ollama.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: ollama-tls
    #   hosts:
    #     - ollama.example.com
