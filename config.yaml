advanced:
  agent_ssim_recheck_seconds: 30
  agent_ssim_skip_threshold: 0.95
  cleanup_interval: 3600
  health_check_interval: 300
  image_format: jpg
  image_quality: 85
  max_concurrent_analyses: 3
  max_consecutive_failures: 5
  max_pending_analyses: 12
  max_stored_images: 100
  motion_burst_interval: 0.2
  motion_burst_ssim: 0.75
  motion_burst_window: 12
  pending_dedupe_ssim: 0.92
  retry_attempts: 3
  retry_delay: 2
  stats_log_interval: 600
camera:
  capture_interval: 5
  detection_image_dir: detected_images
  device_index: 0
  preprocessing:
    diff_threshold: 0.8
  processed_frames_dir: processed_frames
  save_detection_images: true
  save_processed_frames: true
detection:
  prompt: Describe the image in 3-4 sentences.
notifications:
  desktop:
    enabled: true
    message: Unlabeled packaging box detected at {timestamp}
    timeout: 10
    title: ZEDEDA Camera Alert
  email:
    auto_sync_users: true
    enabled: true
    recipients: &recipients
      - adithya7shankar@gmail.com
    sender_email: ''
    smtp_port: 587
    smtp_server: smtp.gmail.com
    use_tls: true
ollama:
  url: http://localhost:11434
  vision_model: gemma3:12b
  decision_model: llama3.2:latest
  timeout: 60
rules:
  - id: UNLABELED_BOX_DETECTED
    description: Trigger when a packaging box without a shipping label is detected
    email:
      body: |

        ZEDEDA Camera Security Alert


        An unlabeled packaging or shipping box has been detected in the camera feed.


        Details:

        - Timestamp: {{timestamp}}

        - Device: {{device}}

        - Detection Response: {{full_response}}

        - Shipping Label Present: {{shipping_label_present}}


        This alert was generated by the ZEDEDA Camera Monitoring Agent.

      subject: Unlabeled Packaging Box Detected - Camera Alert
      to: *recipients
    enabled: true
    id: UNLABELED_BOX_DETECTED
  - id: UNLABELED_BOX
    description: Trigger when the camera vision pipeline detects a packaging box without a visible shipping label.
    condition:
      field: primary_label
      operator: eq
      value: packaging_box_unlabeled
    email:
      to: *recipients
      subject: "Unlabeled packaging box detected"
      body: |
        Hi Adithya,

        The vision pipeline just detected a packaging box without a visible shipping label.
        Event details:
          • label: {{primary_label}}
          • confidence: {{confidence}}
          • timestamp: {{timestamp}}
          • shipping label present: {{shipping_label_present}}

        -- ZEDEDA Email Agent
