advanced:
  agent_ssim_recheck_seconds: 30
  agent_ssim_skip_threshold: 0.95
  max_concurrent_analyses: 1
  max_pending_analyses: 3

memory:
  max_events: 50
  summary_window: 10

camera:
  capture_interval: 30
  detection_image_dir: detected_images
  device_index: 0
  save_detection_images: true

# Unified VLM configuration - single model for both vision and decision
ollama:
  url: http://localhost:11434
  vision_model: qwen3-vl:8b
  timeout: 300
  temperature: 0.1  # Low temperature for deterministic, consistent output

# Streamlined detection prompt
detection:
  prompt: |
    Analyze this image for shipping/packaging boxes.
    
    TASK: Look for brown cardboard shipping boxes and determine if they have shipping labels.
    
    A SHIPPING LABEL is:
    - White or light-colored paper sticker
    - Has printed address, barcode, QR code, or tracking number
    - Physically attached to the box surface
    
    NOT a shipping label:
    - Product logos or brand stickers
    - Handwritten text
    - Markings printed directly on cardboard
    - Tape or seams
    
    Respond with ONLY this JSON format (no other text):
    {
      "detected": true or false,
      "confidence": 0.0 to 1.0,
      "reasoning": "Brief description of what you see",
      "box_count": number,
      "shipping_label_present": true or false or null
    }
    
    RULES:
    - "detected" = true if ANY cardboard shipping box is visible
    - "shipping_label_present" = false if ANY box lacks a proper shipping label
    - "shipping_label_present" = true only if ALL boxes have shipping labels  
    - If no boxes visible: detected=false, box_count=0, shipping_label_present=null

# RF-DETR object detection settings
analysis:
  rf_detr:
    confidence_threshold: 0.3
    model_path: rf-detr-medium.pth

notifications:
  desktop:
    enabled: true
    message: Unlabeled packaging box detected at {timestamp}
    timeout: 10
    title: ZEDEDA Camera Alert
  email:
    auto_sync_users: true
    enabled: true
    recipients: &recipients
      - adithya7shankar@gmail.com
    sender_email: ''
    smtp_port: 587
    smtp_server: smtp.gmail.com
    use_tls: true

rules:
  - id: UNLABELED_BOX_DETECTED
    description: Alert when an unlabeled packaging box is detected
    enabled: true
    email:
      subject: "⚠️ Unlabeled Packaging Box Detected"
      body: |
        ZEDEDA Camera Security Alert
        
        An unlabeled packaging or shipping box has been detected.
        
        Details:
        - Timestamp: {{timestamp}}
        - Confidence: {{confidence}}
        - Description: {{full_response}}
        - Shipping Label Present: {{shipping_label_present}}
        
        This alert was generated by the ZEDEDA Camera Monitoring Agent.
      to: *recipients
