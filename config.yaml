advanced:
  agent_ssim_recheck_seconds: 30
  agent_ssim_skip_threshold: 0.95
  cleanup_interval: 3600
  health_check_interval: 300
  image_format: jpg
  image_quality: 85
  max_concurrent_analyses: 3
  max_consecutive_failures: 5
  max_pending_analyses: 12
  max_stored_images: 100
  motion_burst_interval: 0.2
  motion_burst_ssim: 0.75
  motion_burst_window: 12
  pending_dedupe_ssim: 0.92
  retry_attempts: 3
  retry_delay: 2
  stats_log_interval: 600
memory:
  max_events: 50
  summary_window: 10
camera:
  capture_interval: 5
  detection_image_dir: detected_images
  device_index: 0
  preprocessing:
    diff_threshold: 0.8
  processed_frames_dir: processed_frames
  save_detection_images: true
  save_processed_frames: true
detection:
  prompt: >-
    YOU MUST ANALYZE THIS IMAGE SYSTEMATICALLY. Follow these steps IN ORDER:
    
    ════════════════════════════════════════════════════════════════
    STEP 1: IDENTIFY EACH BOX INDIVIDUALLY
    ════════════════════════════════════════════════════════════════
    Scan the image from LEFT to RIGHT. For EACH cardboard shipping box:
    1. Note its position (left side, center, right side, background)
    2. Describe its appearance (plain brown, has stickers, etc.)
    3. Count it
    
    A SHIPPING BOX is:
    - Brown/tan corrugated cardboard
    - Rectangular shape
    - Used for shipping/delivery (NOT tissue boxes, cereal boxes, product packaging)
    
    ════════════════════════════════════════════════════════════════
    STEP 2: CHECK EACH BOX FOR A SHIPPING LABEL
    ════════════════════════════════════════════════════════════════
    For EACH box you identified, look for a SHIPPING LABEL.
    
    A SHIPPING LABEL **MUST HAVE ALL OF THESE**:
    ✓ WHITE or LIGHT-COLORED PAPER STICKER (not the brown cardboard itself)
    ✓ PHYSICALLY STUCK/ATTACHED to the box surface
    ✓ PRINTED text with addresses, barcodes, QR codes, or tracking numbers
    ✓ CLEARLY VISIBLE as a separate sticker/label (not part of the box)
    
    **NOT A SHIPPING LABEL:**
    ✗ Plain brown cardboard with nothing on it
    ✗ Small product branding stickers (like logos, brand names)
    ✗ Handwritten text (like "PACKAGING", "Fragile", numbers)
    ✗ Logos or text printed ON the cardboard
    ✗ Light/dark patches from wear or lighting
    ✗ Tape, seams, or box flaps
    
    ════════════════════════════════════════════════════════════════
    STEP 3: REPORT YOUR FINDINGS
    ════════════════════════════════════════════════════════════════
    In your "reasoning", describe EACH box separately:
    - Box 1 (position): [plain brown / has white shipping label sticker]
    - Box 2 (position): [plain brown / has white shipping label sticker]
    
    Then set:
    - "detected": true if ANY shipping boxes present, false if none
    - "shipping_label_present": false if ANY box lacks a proper shipping label, true if ALL have shipping labels
    - "box_count": TOTAL number of shipping boxes
    
    BE CONSERVATIVE: If you're not 100% certain a box has an actual white/light paper shipping label with printed address/barcode, assume it does NOT have a shipping label.
    
    
    ════════════════════════════════════════════════════════════════
    RESPONSE FORMAT
    ════════════════════════════════════════════════════════════════
    Respond ONLY with valid JSON (no markdown, no code blocks):
    
    {
      "detected": true or false,
      "confidence": 0.0 to 1.0,
      "reasoning": "Box 1 (left side): [plain/has label]. Box 2 (center): [plain/has label]. Total: X boxes, Y with labels.",
      "shipping_label_present": true or false,
      "box_count": number,
      "box_description": "brief description"
    }
    
    DECISION RULES:
    ✓ "detected" = true → At least 1 shipping box present
    ✓ "detected" = false → No shipping boxes at all
    ✓ "shipping_label_present" = false → At least 1 box WITHOUT a proper shipping label
    ✓ "shipping_label_present" = true → ALL boxes have proper shipping labels
    ✓ "box_count" → TOTAL boxes (including ones without labels)
    
    EXAMPLE for 3 boxes (2 plain, 1 with shipping label):
    {
      "detected": true,
      "confidence": 0.9,
      "reasoning": "Box 1 (left): Plain brown cardboard, no stickers. Box 2 (center): Has small blue product sticker, NOT a shipping label. Box 3 (right): Has large white shipping label with barcode and address. Total: 3 boxes, only 1 with shipping label.",
      "shipping_label_present": false,
      "box_count": 3,
      "box_description": "Three boxes, two unlabeled"
    }
    
    Return ONLY the JSON object, nothing else.
notifications:
  desktop:
    enabled: true
    message: Unlabeled packaging box detected at {timestamp}
    timeout: 10
    title: ZEDEDA Camera Alert
  email:
    auto_sync_users: true
    enabled: true
    recipients: &recipients
      - adithya7shankar@gmail.com
    sender_email: ''
    smtp_port: 587
    smtp_server: smtp.gmail.com
    use_tls: true
ollama:
  url: http://localhost:11434
  vision_model: llama3.2-vision:11b
  decision_model: hf.co/bartowski/nvidia_NVIDIA-Nemotron-Nano-9B-v2-GGUF:Q4_K_M
  timeout: 90
decision_llm:
  timeout: 90
rules:
  - id: UNLABELED_BOX_DETECTED
    description: Trigger when a packaging box without a shipping label is detected
    email:
      body: |

        ZEDEDA Camera Security Alert


        An unlabeled packaging or shipping box has been detected in the camera feed.


        Details:

        - Timestamp: {{timestamp}}

        - Device: {{device}}

        - Detection Response: {{full_response}}

        - Shipping Label Present: {{shipping_label_present}}


        This alert was generated by the ZEDEDA Camera Monitoring Agent.

      subject: Unlabeled Packaging Box Detected - Camera Alert
      to: *recipients
    enabled: true
    id: UNLABELED_BOX_DETECTED
  - id: UNLABELED_BOX
    description: Trigger when the camera vision pipeline detects a packaging box without a visible shipping label.
    condition:
      field: primary_label
      operator: eq
      value: packaging_box_unlabeled
    email:
      to: *recipients
      subject: "Unlabeled packaging box detected"
      body: |
        Hi Adithya,

        The vision pipeline just detected a packaging box without a visible shipping label.
        Event details:
          • label: {{primary_label}}
          • confidence: {{confidence}}
          • timestamp: {{timestamp}}
          • shipping label present: {{shipping_label_present}}

        -- ZEDEDA Email Agent
