advanced:
  # ═══════════════════════════════════════════════════════════════════════
  # LEGACY REACTIVE MODE SETTINGS
  # These are used ONLY for the old reactive monitoring mode.
  # The new proactive agentic mode does NOT use SSIM thresholds or rules.
  # ═══════════════════════════════════════════════════════════════════════
  agent_ssim_recheck_seconds: 30  # Legacy: reactive mode only
  agent_ssim_skip_threshold: 0.95  # Legacy: NOT used in proactive mode
  max_concurrent_analyses: 1
  max_pending_analyses: 3
memory:
  max_events: 50
  summary_window: 10
camera:
  capture_interval: 30
  detection_image_dir: detected_images
  device_index: 0
  save_detection_images: true

proactive:
  # ═══════════════════════════════════════════════════════════════════════
  # PROACTIVE AGENTIC MONITORING
  # ═══════════════════════════════════════════════════════════════════════
  # LLM-driven intelligent monitoring that understands context and makes
  # decisions based on reasoning, not rules. Enable this for truly adaptive
  # camera monitoring that responds to natural language instructions.
  # 
  # Example instructions:
  #   - "Monitor the conveyor for PCB defects"
  #   - "Watch for packages without shipping labels"
  #   - "Check PPE compliance for workers in the area"
  # 
  # All config values are GUIDELINES for the LLM, not hard thresholds.
  # ═══════════════════════════════════════════════════════════════════════
  enabled: false  # Set to true to enable proactive mode
  frame_interval_seconds: 1.5  # Frame check frequency (guideline)
  stability_frame_count: 6  # Stability hint for LLM (not a rule)
  observation_temperature: 0.1  # Lower = consistent observations
  decision_temperature: 0.2  # Balanced for intelligent decisions
  quick_check_temperature: 0.15  # Fast confirmations
  inspection_ttl_seconds: 180  # Scene memory duration
  max_idle_seconds: 300  # Idle awareness context

# vLLM configuration - high-performance inference backend
vllm:
  url: http://localhost:8000
  model: Qwen/Qwen3-VL-8B-Instruct
  timeout: 300
  temperature: 0.1

# Ollama configuration (legacy - used if vllm config is not present)
# ollama:
#   url: http://localhost:11434
#   vision_model: qwen3-vl:8b
#   timeout: 300
#   temperature: 0.1

detection:
  prompt: "Analyze this image for shipping/packaging boxes.\n\nTASK: Look for brown\
    \ cardboard shipping boxes and determine if they have shipping labels.\n\nA SHIPPING\
    \ LABEL is:\n- White or light-colored paper sticker\n- Has printed address, barcode,\
    \ QR code, or tracking number\n- Physically attached to the box surface\n\nNOT\
    \ a shipping label:\n- Product logos or brand stickers\n- Handwritten text\n-\
    \ Markings printed directly on cardboard\n- Tape or seams\n\nRespond with ONLY\
    \ this JSON format (no other text):\n{\n  \"detected\": true or false,\n  \"confidence\"\
    : 0.0 to 1.0,\n  \"reasoning\": \"Brief description of what you see\",\n  \"box_count\"\
    : number,\n  \"shipping_label_present\": true or false or null\n}\n\nRULES:\n\
    - \"detected\" = true if ANY cardboard shipping box is visible\n- \"shipping_label_present\"\
    \ = false if ANY box lacks a proper shipping label\n- \"shipping_label_present\"\
    \ = true only if ALL boxes have shipping labels  \n- If no boxes visible: detected=false,\
    \ box_count=0, shipping_label_present=null\n"
analysis: {}
notifications:
  desktop:
    enabled: true
    message: Unlabeled packaging box detected at {timestamp}
    timeout: 10
    title: ZEDEDA Camera Alert
  email:
    auto_sync_users: true
    enabled: true
    recipients: &id001 []
    sender_email: ''
    smtp_port: 587
    smtp_server: smtp.gmail.com
    use_tls: true
rules:
- id: UNLABELED_BOX_DETECTED
  description: Alert when an unlabeled packaging box is detected
  enabled: true
  email:
    subject: ⚠️ Unlabeled Packaging Box Detected
    body: 'ZEDEDA Camera Security Alert


      An unlabeled packaging or shipping box has been detected.


      Details:

      - Timestamp: {{timestamp}}

      - Confidence: {{confidence}}

      - Description: {{full_response}}

      - Shipping Label Present: {{shipping_label_present}}


      This alert was generated by the ZEDEDA Camera Monitoring Agent.

      '
    to: *id001
