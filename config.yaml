memory:
  max_events: 50
  summary_window: 10
camera:
  detection_image_dir: detected_images
  save_detection_images: true

proactive:
  # ═══════════════════════════════════════════════════════════════════════
  # PROACTIVE AGENTIC MONITORING
  # ═══════════════════════════════════════════════════════════════════════
  # LLM-driven intelligent monitoring that understands context and makes
  # decisions based on reasoning, not rules. Enable this for truly adaptive
  # camera monitoring that responds to natural language instructions.
  # 
  # Example instructions:
  #   - "Monitor the conveyor for PCB defects"
  #   - "Watch for PCB damage when boards stop under the camera"
  #   - "Inspect each stopped PCB for solder defects"
  # 
  # All config values are GUIDELINES for the LLM, not hard thresholds.
  # ═══════════════════════════════════════════════════════════════════════
  enabled: true  # Set to true to enable proactive mode
  frame_interval_seconds: 0.1  # Fast conveyor gating cadence
  fast_observation_mode: true  # Use CV-only fast path for motion/zone gating
  stationary_motion_threshold: 1.8  # Lower = more sensitive to movement
  zone_crop_top_ratio: 0.2  # ROI crop top (fraction of frame height)
  zone_crop_bottom_ratio: 0.85  # ROI crop bottom (fraction of frame height)
  zone_presence_threshold: 12.0  # Edge-density threshold for board presence in ROI
  selector_min_stable_frames: 2  # Require stable streak before VLM inspection
  selector_min_quality_score: 0.45  # Minimum deterministic frame-quality gate
  selector_attempt_cooldown_seconds: 0.35  # Cooldown between VLM inspections
  selector_quality_improvement_delta: 0.08  # Require quality gain for re-attempt
  selector_max_attempts_per_board: 3  # Hard cap VLM attempts per stopped board
  selector_near_deadline_seconds: 0.7  # Use best cached frame near timeout
  # Camera-focus settle window (after a board stops, before inspection).
  # The loop exits as soon as focus stops improving instead of always waiting
  # the full window, and inspects the sharpest in-zone frame it observed.
  settle_max_seconds: 4.0  # Upper bound; previous behaviour was a fixed 4s wait
  settle_min_seconds: 0.4  # Never exit before auto-focus has begun reacting
  settle_focus_plateau_frames: 5  # Consecutive non-improving frames => focused
  settle_focus_improve_ratio: 1.02  # Focus gain that still counts as improving
  stability_frame_count: 6  # Stability hint for LLM (not a rule)
  observation_temperature: 0.1  # Lower = consistent observations
  decision_temperature: 0.2  # Balanced for intelligent decisions
  quick_check_temperature: 0.15  # Fast confirmations
  inspection_ttl_seconds: 180  # Scene memory duration
  max_idle_seconds: 300  # Idle awareness context

# vLLM configuration - high-performance inference backend
vllm:
  url: http://localhost:8000
  model: auto  # auto-detected from server; set VISION_MODEL env to override
  timeout: 300
  temperature: 0.1

detection:
  prompt: "Analyze this image for conveyor-based PCB inspection.\n\nTASK: Determine whether\
    \ a PCB is present and whether it appears stable enough for defect inspection. Then\
    \ assess potential manufacturing defects.\n\nRespond with ONLY this JSON format (no\
    \ other text):\n{\n  \"detected\": true or false,\n  \"confidence\": 0.0 to\
    \ 1.0,\n  \"reasoning\": \"Brief description of PCB state and quality\",\n  \"pcb_count\"\
    : number,\n  \"pcb_stable\": true or false or null,\n  \"should_alert\": true\
    \ or false\n}\n"
  inspection_prompt: ""
analysis: {}
notifications:
  desktop:
    enabled: true
    message: PCB defect alert condition detected at {timestamp}
    timeout: 10
    title: ZEDEDA Camera Alert
  email:
    auto_sync_users: true
    enabled: true
    recipients: &id001 []
    sender_email: ''
    smtp_port: 587
    smtp_server: smtp.gmail.com
    use_tls: true
  # Agent notification preferences (controllable via chat)
  agent:
    email_enabled: true
    min_severity: medium   # low, medium, high
    notify_on_threshold_exceeded: true
    quiet_hours_start: null  # HH:MM or null
    quiet_hours_end: null
    daily_digest_enabled: false
    daily_digest_time: "08:00"

# Defect monitoring thresholds (used by check_threshold_alerts tool)
thresholds:
  max_defects_per_day: 10
  max_high_severity_per_day: 5
  trend_window_hours: 168   # 1 week
rules:
- id: PCB_DEFECT_DETECTED
  description: Alert when a PCB defect condition is detected
  enabled: true
  email:
    subject: ⚠️ PCB Defect Condition Detected
    body: 'ZEDEDA Camera Security Alert


      A PCB defect condition has been detected.


      Details:

      - Timestamp: {{timestamp}}

      - Confidence: {{confidence}}

      - Description: {{full_response}}

      - PCB Stable Under Camera: {{pcb_stable}}


      This alert was generated by the ZEDEDA Camera Monitoring Agent.

      '
    to: *id001
