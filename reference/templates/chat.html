<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ config.title }} - {{ config.description }}</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="apple-touch-icon" href="/static/favicon.png">
    
    <!-- Fonts & Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/chat.css">
    
    <!-- Additional inline styles for toast notifications -->
    <style>
        /* Toast notifications */
        #toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .toast {
            padding: 12px 20px;
            background: var(--gray-900);
            color: white;
            border-radius: 12px;
            font-size: 14px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            animation: toastSlideIn 0.25s ease-out;
        }
        
        @keyframes toastSlideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .toast-success { background: var(--color-success); }
        .toast-error { background: var(--color-error); }
        .toast-warning { background: var(--color-warning); }
        
        .toast-fade-out {
            animation: fadeOut 0.3s ease-out forwards;
        }
        
        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(10px); }
        }
        
        /* Form hints */
        .text-error { color: var(--color-error) !important; }
        .text-success { color: var(--color-success) !important; }
        .text-warning { color: var(--color-warning) !important; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Session Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <button id="sidebar-collapse-btn" class="sidebar-collapse-btn" title="Collapse sidebar">
                    <i class="fas fa-bars"></i>
                </button>
                <button id="new-chat-btn" class="new-chat-btn">
                    <i class="fas fa-plus"></i>
                    <span>New Chat</span>
                </button>
            </div>
            
            <div id="session-list" class="session-list">
                <!-- Sessions rendered dynamically -->
            </div>
            
            <div class="sidebar-footer">
                <button id="export-sessions-btn" class="sidebar-footer-btn" title="Export sessions">
                    <i class="fas fa-download"></i>
                </button>
                <button id="import-sessions-btn" class="sidebar-footer-btn" title="Import sessions">
                    <i class="fas fa-upload"></i>
                </button>
                <input type="file" id="import-sessions-input" accept=".json" style="display: none;">
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="main-wrapper">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <!-- Sidebar expand button (visible when collapsed) -->
                    <button id="sidebar-expand-btn" class="sidebar-expand-btn" title="Open sidebar">
                        <i class="fas fa-bars"></i>
                    </button>
                    <img id="header-logo" src="/static/logo-light.png" alt="ZEDEDA" class="header-logo">
                    <span class="header-title">{{ config.title }}</span>
                </div>
                <div class="header-right">
                    <div class="header-status">
                        <span id="header-status-dot" class="status-dot"></span>
                        <span id="header-status-text">Not configured</span>
                    </div>
                    <button id="settings-btn" class="btn btn-icon btn-ghost" title="Settings">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </header>

            <!-- Main Content -->
            <main class="main-content">
                <div class="chat-container">
                <!-- Messages -->
                <div id="chat-messages" class="chat-messages">
                    <div class="chat-messages-inner">
                        <!-- Messages will be inserted here -->
                    </div>
                </div>

                <!-- Input Area -->
                <div id="chat-input-area" class="chat-input-area hidden">
                    <div class="chat-input-wrapper">
                        <!-- Attachment Preview -->
                        <div id="attachment-preview" class="attachment-preview hidden"></div>
                        
                        <!-- Input Container - Card style with attachment inside -->
                        <div class="chat-input-container">
                            <!-- Attachment Button Menu Wrapper -->
                            <div class="attachment-menu-wrapper">
                                <button id="attachment-btn" class="attachment-btn" title="Attach files">
                                    <i class="fas fa-plus"></i>
                                </button>
                                
                                <!-- Attachment Menu -->
                                <div id="attachment-menu" class="attachment-menu hidden">
                                    <button id="attach-image-btn" class="attachment-menu-item">
                                        <i class="fas fa-image"></i>
                                        <span>Upload Image</span>
                                    </button>
                                    <button id="attach-file-btn" class="attachment-menu-item">
                                        <i class="fas fa-file-alt"></i>
                                        <span>Upload File</span>
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Text Input -->
                            <textarea 
                                id="chat-input" 
                                class="chat-textarea" 
                                placeholder="Ask about deployed models, run inference, get integration code..."
                                rows="1"
                            ></textarea>
                            
                            <!-- Send Button -->
                            <button id="chat-send-btn" class="chat-send-btn" title="Send">
                                <i class="fas fa-arrow-up"></i>
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Hidden File Inputs -->
                <input type="file" id="attach-image-input" accept="image/*" style="display: none;">
                <input type="file" id="attach-file-input" accept=".txt,.pdf,.json,.md" style="display: none;">
            </div>
        </main>
    </div><!-- end main-wrapper -->
    </div><!-- end app-container -->

    <!-- Settings Panel Overlay -->
    <div id="settings-overlay" class="settings-overlay hidden">
        <div class="settings-panel">
            <div class="settings-header">
                <h2><i class="fas fa-cog"></i> Settings</h2>
                <button id="settings-close-btn" class="btn btn-icon btn-ghost">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="settings-content">
                <!-- Appearance Section -->
                <div class="settings-section">
                    <h3 class="settings-section-title">
                        <i class="fas fa-palette"></i> Appearance
                    </h3>
                    <p class="settings-description">Switch between light and dark themes.</p>
                    <button id="theme-toggle-btn" class="btn btn-secondary btn-sm">
                        <i class="fas fa-moon"></i>
                        <span id="theme-toggle-label">Enable Dark Theme</span>
                    </button>
                </div>

                <!-- LLM Configuration Section -->
                <div class="settings-section">
                    <h3 class="settings-section-title">
                        <i class="fas fa-robot"></i> LLM Configuration
                    </h3>
                    <p class="settings-description">
                        Connect to an LLM provider to enable the AI assistant.
                    </p>
                    
                    <!-- Add Credential Form -->
                    <div class="card" style="margin-bottom: var(--spacing-4);">
                        <div class="card-body">
                            <div class="form-group">
                                <label class="form-label">Configuration Name</label>
                                <input type="text" id="cred-name" class="form-input" placeholder="e.g., my-lmstudio">
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Provider Type</label>
                                <select id="cred-provider-type" class="form-select">
                                    <option value="groq">Groq (Cloud - Fast)</option>
                                    <option value="lmstudio">LM Studio (Local)</option>
                                    <option value="ollama">Ollama (Local)</option>
                                    <option value="openai-compatible">OpenAI Compatible (Local)</option>
                                    <option value="vllm">vLLM (Local)</option>
                                    <option value="tgi">TGI (Local)</option>
                                    <option value="openai">OpenAI (Cloud)</option>
                                    <option value="anthropic">Anthropic (Cloud)</option>
                                    <option value="google">Google (Cloud)</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">API Key</label>
                                <input type="password" id="cred-api-key" class="form-input" placeholder="sk-...">
                                <span id="api-key-hint" class="form-hint">(optional for local servers)</span>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Server URL</label>
                                <input type="text" id="cred-url" class="form-input" placeholder="http://192.168.x.x:1234/v1">
                                <span id="url-hint" class="form-hint">(required)</span>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">
                                    Model
                                    <button id="fetch-models-btn" class="btn btn-sm btn-secondary" style="margin-left: 8px;">
                                        <i class="fas fa-sync-alt"></i> Fetch
                                    </button>
                                </label>
                                <select id="cred-model-select" class="form-select hidden">
                                    <option value="">-- Select a model --</option>
                                </select>
                                <input type="text" id="cred-model" class="form-input" placeholder="e.g., google/gemma-3-4b">
                                <span id="fetch-status" class="form-hint"></span>
                            </div>
                            
                            <div class="form-group">
                                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                    <input type="checkbox" id="cred-supports-tools" checked>
                                    <span class="form-label" style="margin: 0;">Supports Tool Calling</span>
                                </label>
                            </div>
                            
                            <button id="save-activate-btn" class="btn btn-primary" style="width: 100%;">
                                <i class="fas fa-bolt"></i> Save & Activate
                            </button>
                        </div>
                    </div>
                    
                    <!-- Saved Configurations -->
                    <h4 style="font-size: var(--font-size-sm); color: var(--gray-600); margin-bottom: var(--spacing-3);">
                        Saved Configurations
                    </h4>
                    <div id="credentials-list" class="credential-list">
                        <!-- Credentials loaded dynamically -->
                    </div>
                    
                    <!-- Import/Export -->
                    <div style="display: flex; gap: var(--spacing-2); margin-top: var(--spacing-4);">
                        <button id="export-config-btn" class="btn btn-secondary btn-sm">
                            <i class="fas fa-download"></i> Export
                        </button>
                        <button id="import-config-btn" class="btn btn-secondary btn-sm">
                            <i class="fas fa-upload"></i> Import
                        </button>
                        <input type="file" id="import-file-input" accept=".json" style="display: none;">
                    </div>
                </div>
                
                <!-- LLM Router Status -->
                <div class="settings-section">
                    <h3 class="settings-section-title">
                        <i class="fas fa-route"></i> LLM Router Status
                    </h3>
                    <div id="router-status">
                        <div class="empty-state">
                            <div class="loading-spinner"></div>
                        </div>
                    </div>
                </div>
                
                <!-- Inference Server Status -->
                <div class="settings-section">
                    <h3 class="settings-section-title">
                        <i class="fas fa-server"></i> Inference Server
                    </h3>
                    <div id="server-status">
                        <div class="empty-state">
                            <div class="loading-spinner"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Image Modal -->
    <div id="image-modal" class="image-modal hidden">
        <button class="image-modal-close"><i class="fas fa-times"></i></button>
        <img id="modal-image" src="" alt="Full size image">
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Scripts -->
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/markdown.js"></script>
    <script src="/static/js/store.js"></script>
    <script src="/static/js/sidebar.js"></script>
    <script src="/static/js/settings.js"></script>
    <script src="/static/js/chat.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
