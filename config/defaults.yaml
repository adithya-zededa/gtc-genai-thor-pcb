# Configuration defaults
# These can be overridden by environment variables or config.yaml

database:
  path: camera_agent.db

camera:
  device_index: 0
  width: 640
  height: 480
  fps: 30
  capture_interval: 30
  save_detection_images: true
  detection_image_dir: detected_images

proactive:
  # ═══════════════════════════════════════════════════════════════════════
  # PROACTIVE MONITORING CONFIGURATION
  # ═══════════════════════════════════════════════════════════════════════
  # Enables intelligent, LLM-driven camera monitoring that:
  #   - Understands natural language instructions
  #   - Maintains temporal awareness across frames
  #   - Decides autonomously when/how to analyze frames
  #   - Adapts behavior based on scene changes
  # 
  # All values are GUIDELINES for the LLM, not rigid thresholds.
  # The LLM makes final decisions based on reasoning and context.
  # ═══════════════════════════════════════════════════════════════════════
  
  enabled: false  # Enable/disable proactive mode
  
  # Frame Processing
  frame_interval_seconds: 1.5  # How often to check frames (guideline, not rule)
  stability_frame_count: 6  # Context hint for scene stability (not a threshold)
  
  # LLM Temperature Settings (lower = more deterministic, higher = more creative)
  observation_temperature: 0.1  # Observation stage (keep low for consistent perceiving)
  decision_temperature: 0.2  # Decision stage (balanced for intelligent reasoning)
  quick_check_temperature: 0.15  # Quick check stage (fast confirmations)
  
  # Context Management
  inspection_ttl_seconds: 180  # How long to remember inspected scenes
  max_idle_seconds: 300  # Context hint for idle time awareness
  
  # Default Instruction (used if none provided via API)
  default_instruction: "Monitor the scene and detect any anomalies or objects of interest."

inference:
  backend: vllm
  vllm:
    url: http://localhost:8000
    model: Qwen/Qwen3-VL-8B-Instruct
    timeout: 300
    temperature: 0.1
  ollama:
    url: http://localhost:11434
    vision_model: qwen3-vl:8b
    timeout: 300
    temperature: 0.1

flask:
  host: 0.0.0.0
  port: 8080
  debug: false
  socketio_cors: "*"

router:
  enabled: false
  routing_strategy: failover
  auto_discover: true
  use_for_classification: true
  use_for_chat: true

memory:
  max_events: 50
  summary_window: 10

notifications:
  email_enabled: true
  desktop_enabled: true

http_timeout: 5.0
