apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-https-proxy
  namespace: zededa
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    
    http {
        server {
            listen 443 ssl;
            server_name _;
            
            ssl_certificate /etc/nginx/ssl/tls.crt;
            ssl_certificate_key /etc/nginx/ssl/tls.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers HIGH:!aNULL:!MD5;
            
            # Proxy web interface
            location / {
                proxy_pass http://zededa-vision-zededa-vision-ai-web:80;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            # Proxy Ollama API
            location /api/ {
                proxy_pass http://zededa-vision-zededa-vision-ai-ollama:11434/api/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                
                # Streaming and timeout settings for Ollama
                chunked_transfer_encoding on;
                proxy_buffering off;
                proxy_cache off;
                proxy_read_timeout 300s;
                proxy_connect_timeout 75s;
                proxy_send_timeout 300s;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: https-proxy
  namespace: zededa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: https-proxy
  template:
    metadata:
      labels:
        app: https-proxy
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 443
          name: https
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: tls-cert
          mountPath: /etc/nginx/ssl
          readOnly: true
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-https-proxy
      - name: tls-cert
        secret:
          secretName: zededa-vision-tls
---
apiVersion: v1
kind: Service
metadata:
  name: https-proxy
  namespace: zededa
spec:
  type: LoadBalancer
  ports:
  - port: 443
    targetPort: 443
    nodePort: 30443
    protocol: TCP
    name: https
  selector:
    app: https-proxy
