advanced:
  cleanup_interval: 3600
  health_check_interval: 300
  image_format: jpg
  image_quality: 85
  max_concurrent_analyses: 3
  max_pending_analyses: 12
  max_consecutive_failures: 5
  max_stored_images: 100
  motion_burst_interval: 0.2
  motion_burst_window: 12.0
  motion_burst_ssim: 0.75
  pending_dedupe_ssim: 0.92
  retry_attempts: 3
  retry_delay: 2
  stats_log_interval: 600
camera:
  device_index: 0
  capture_interval: 5
  save_detection_images: true
  save_processed_frames: true
  detection_image_dir: detected_images
  processed_frames_dir: processed_frames
  preprocessing:
    diff_threshold: 0.8
ollama:
  url: http://localhost:11434
  model: gemma:4b
  timeout: 60
detection:
  prompt: Describe the image in 2-3 concise sentences.
rules:
- id: MONITOR_DETECTED
  description: Trigger when a computer monitor is detected
  enabled: true
  email:
    to: &id001
    - adithya7shankar@gmail.com
    - adithya@zededa.com
    subject: Computer Monitor Detected - Camera Alert
    body: '

      ZEDEDA Camera Security Alert


      A computer monitor/screen has been detected in the camera feed.


      Details:

      - Timestamp: {{timestamp}}

      - Device: {{device}}

      - Detection Response: {{full_response}}


      This alert was generated by the ZEDEDA Camera Monitoring Agent.

      '
notifications:
  email:
    enabled: false
    smtp_server: smtp.gmail.com
    smtp_port: 587
    sender_email: ''
    use_tls: true
    recipients: *id001
    auto_sync_users: true
  desktop:
    enabled: true
    timeout: 10
    title: ZEDEDA Camera Alert
    message: Computer monitor detected at {timestamp}
