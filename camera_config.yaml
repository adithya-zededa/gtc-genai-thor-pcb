# ZEDEDA Camera Monitor Configuration
# Configuration for computer monitor detection agent

camera:
  device_index: 0  # /dev/video0
  capture_interval: 5  # seconds between captures
  resolution:
    width: 640
    height: 480
  save_detection_images: true  # Save images when monitors are detected
  save_processed_frames: true  # Save all frames that are processed by the LLM
  
  # Frame preprocessing to reduce unnecessary LLM calls
  preprocessing:
    enabled: true
    diff_threshold: 0.80  # SSIM threshold for detecting scene changes (lower = more sensitive)

ollama:
  base_url: "http://localhost:11434"
  model: "gemma3:4b"
  timeout: 60  # seconds

detection:
  # Prompt for the vision model
  prompt: |
    Describe what you see in this image in 2-3 concise sentences. Focus on identifying objects, furniture, electronics, and the general setting. Be specific about any screens, displays, or computer equipment you observe.
    
    Examples of good descriptions:
    - "A desk with a laptop computer, wireless mouse, and coffee mug. A monitor is visible on the left side showing a desktop interface."
    - "A living room with a sofa, coffee table, and wall-mounted television. No computer equipment visible."
    - "An office workspace with dual monitors, keyboard, and office chair. Papers and notebooks scattered on the desk."
    - "A kitchen counter with appliances and a tablet device lying flat."
    
    Describe exactly what you observe without making assumptions.
  
  confidence_threshold: 0.7
  
  # Keywords that indicate monitor detection in the AI response
  positive_keywords:
    - "monitor"
    - "screen"
    - "display"
    - "computer"
    - "laptop"
    - "desktop"
    - "yes"
    - "visible"
    - "see"
  
  # Keywords that indicate no monitor detected
  negative_keywords:
    - "no"
    - "not"
    - "none"
    - "absent"
    - "missing"

# Alert rules configuration
rules:
  - id: "MONITOR_DETECTED"
    description: "Trigger alert when a computer monitor is detected in camera feed"
    enabled: true
    conditions:
      - field: "primary_label"
        operator: "eq"
        value: "computer_monitor"
    actions:
      email:
        enabled: true
        to:
          - "adithya7shankar@gmail.com"
        subject: "🖥️ Computer Monitor Detected - ZEDEDA Security Alert"
        body: |
          ZEDEDA Camera Security Alert
          
          A computer monitor or screen has been detected in the camera feed.
          
          Detection Details:
          - Timestamp: {{timestamp}}
          - Camera Device: {{device}}
          - Confidence Level: {{confidence}}
          - AI Analysis: {{full_response}}
          
          This alert was automatically generated by the ZEDEDA Camera Monitoring Agent.
          If this is a false positive, please review the detection configuration.
          
          Best regards,
          ZEDEDA Security System

  - id: "LAPTOP_DETECTED"
    description: "Trigger alert when a laptop screen is detected"
    enabled: true
    conditions:
      - field: "full_response"
        operator: "contains"
        value: "laptop"
    actions:
      email:
        enabled: true
        to:
          - "adithya7shankar@gmail.com"
        subject: "💻 Laptop Screen Detected - ZEDEDA Security Alert"
        body: |
          ZEDEDA Camera Security Alert
          
          A laptop screen has been specifically detected in the camera feed.
          
          Detection Details:
          - Timestamp: {{timestamp}}
          - Camera Device: {{device}}
          - Confidence Level: {{confidence}}
          - AI Analysis: {{full_response}}
          
          Best regards,
          ZEDEDA Security System

# Notification settings
notifications:
  # Email notifications
  email:
    enabled: true
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    use_tls: true
    sender_email: "ace7esstest@gmail.com"  # Set via EMAIL_USER env var
    sender_password: "990001Lol!"  # Set via EMAIL_PASS env var
    
  # Desktop notifications (if plyer is available)
  desktop:
    enabled: true
    timeout: 10  # seconds
    
  # Log file notifications
  log:
    enabled: true
    level: "INFO"
    file: "camera_detections.log"

# Advanced settings
advanced:
  # Image processing
  image_quality: 85  # JPEG quality (1-100)
  image_format: "jpg"
  
  # Performance tuning
  max_concurrent_analyses: 1
  retry_attempts: 3
  retry_delay: 2  # seconds
  
  # Storage settings
  max_stored_images: 100  # Maximum detection images to keep
  cleanup_interval: 3600  # seconds (1 hour)
  
  # Health monitoring
  health_check_interval: 300  # seconds (5 minutes)
  max_consecutive_failures: 5
  
  # Statistics reporting
  stats_log_interval: 600  # seconds (10 minutes)
  
# Environment variable defaults (can be overridden)
env_defaults:
  OLLAMA_URL: "http://localhost:11434"
  VISION_MODEL: "gemma3:4b"
  CAMERA_INDEX: "0"
  CAPTURE_INTERVAL: "5"
  EMAIL_USER: ""
  EMAIL_PASS: ""
  LOG_LEVEL: "INFO"