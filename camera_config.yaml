advanced:
  cleanup_interval: 3600
  health_check_interval: 300
  image_format: jpg
  image_quality: 85
  max_concurrent_analyses: 1
  max_consecutive_failures: 5
  max_stored_images: 100
  retry_attempts: 3
  retry_delay: 2
  stats_log_interval: 600
camera:
  capture_interval: 5
  device_index: 0
  preprocessing:
    diff_threshold: 0.8
    enabled: true
  resolution:
    height: 480
    width: 640
  save_detection_images: true
  save_processed_frames: true
detection:
  confidence_threshold: 0.7
  negative_keywords:
  - 'no'
  - not
  - none
  - absent
  - missing
  positive_keywords:
  - monitor
  - screen
  - display
  - computer
  - laptop
  - desktop
  - 'yes'
  - visible
  - see
  prompt: 'Describe what you see in this image in 2-3 concise sentences. Focus on
    identifying objects, furniture, electronics, and the general setting. Be specific
    about any screens, displays, or computer equipment you observe.


    Examples of good descriptions:

    - "A desk with a laptop computer, wireless mouse, and coffee mug. A monitor is
    visible on the left side showing a desktop interface."

    - "A living room with a sofa, coffee table, and wall-mounted television. No computer
    equipment visible."

    - "An office workspace with dual monitors, keyboard, and office chair. Papers
    and notebooks scattered on the desk."

    - "A kitchen counter with appliances and a tablet device lying flat."


    Describe exactly what you observe without making assumptions.

    '
env_defaults:
  CAMERA_INDEX: '0'
  CAPTURE_INTERVAL: '5'
  EMAIL_PASS: ''
  EMAIL_USER: ''
  LOG_LEVEL: INFO
  OLLAMA_URL: http://localhost:11434
  VISION_MODEL: gemma3:4b
notifications:
  desktop:
    enabled: true
    timeout: 10
  email:
    enabled: true
    sender_email: ace7esstest@gmail.com
    sender_password: 990001Lol!
    smtp_port: 587
    smtp_server: smtp.gmail.com
    use_tls: true
  log:
    enabled: true
    file: camera_detections.log
    level: INFO
ollama:
  base_url: http://localhost:11434
  model: gemma3:4b
  decision_model: llama3.2:latest
  timeout: 60
rules:
- actions:
    email:
      body: 'ZEDEDA Camera Security Alert


        A computer monitor or screen has been detected in the camera feed.


        Detection Details:

        - Timestamp: {{timestamp}}

        - Camera Device: {{device}}

        - Confidence Level: {{confidence}}

        - AI Analysis: {{full_response}}


        This alert was automatically generated by the ZEDEDA Camera Monitoring Agent.

        If this is a false positive, please review the detection configuration.


        Best regards,

        ZEDEDA Security System

        '
      enabled: true
      subject: 🖥️ Computer Monitor Detected - ZEDEDA Security Alert
      to: &id001
      - adithya7shankar@gmail.com
      - adithya@zededa.com
  conditions:
  - field: primary_label
    operator: eq
    value: computer_monitor
  description: Trigger alert when a computer monitor is detected in camera feed
  enabled: true
  id: MONITOR_DETECTED
- actions:
    email:
      body: 'ZEDEDA Camera Security Alert


        A laptop screen has been specifically detected in the camera feed.


        Detection Details:

        - Timestamp: {{timestamp}}

        - Camera Device: {{device}}

        - Confidence Level: {{confidence}}

        - AI Analysis: {{full_response}}


        Best regards,

        ZEDEDA Security System

        '
      enabled: true
      subject: 💻 Laptop Screen Detected - ZEDEDA Security Alert
      to: *id001
  conditions:
  - field: full_response
    operator: contains
    value: laptop
  description: Trigger alert when a laptop screen is detected
  enabled: true
  id: LAPTOP_DETECTED
